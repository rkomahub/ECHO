[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-spin"
version = "0.1.0"
description = "Python library for simulating the dynamics and control of interacting quantum spin systems."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "numpy",
    "qutip",
    "matplotlib"
]

[project.optional-dependencies]
test = [
    "pytest"
]